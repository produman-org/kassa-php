name: Проверки SDK

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / HttpClient ${{ matrix.http }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        http: ['5.4', '6.0', '7.0', '8.0']
        mode: [latest]
        exclude:
          - php: '8.2'
            http: '8.0'
          - php: '8.3'
            http: '8.0'
        include:
          - php: '8.2'
            http: '5.4'
            mode: lowest
          - php: '8.2'
            http: '6.0'
            mode: lowest
          - php: '8.2'
            http: '7.0'
            mode: lowest
          - php: '8.4'
            http: '8.0'
            mode: lowest
    env:
      COMPOSER_NO_INTERACTION: '1'
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Подготовить PHP и Composer
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - name: Проверить manifest и синтаксис
        run: |
          composer validate --strict
          find src tests tools -name '*.php' -print0 | xargs -0 -n1 php -l
          echo "KASSA_TEST_ARTIFACTS=$RUNNER_TEMP/sdk-artifacts" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sdk-artifacts"
      - name: Проверить production-зависимости, чистую установку и полный набор
        env:
          HTTP_LINE: ${{ matrix.http }}
          DEPENDENCY_MODE: ${{ matrix.mode }}
        run: |
          if [ "$DEPENDENCY_MODE" = 'lowest' ]; then
            php tools/check-consumer.php "--http-client=^$HTTP_LINE" --prefer-lowest --run-tests
          else
            php tools/check-consumer.php "--http-client=^$HTTP_LINE" --run-tests
          fi
      - name: Сохранить версии зависимостей и результаты
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-php${{ matrix.php }}-http${{ matrix.http }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/sdk-artifacts
          if-no-files-found: ignore
