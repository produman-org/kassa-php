name: Проверки SDK

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP 8.5 / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: ['8.1', 'latest', 'lowest']
    env:
      COMPOSER_NO_INTERACTION: '1'
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Подготовить PHP и Composer
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.5'
          extensions: curl, dom, mbstring, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - name: Проверить manifest и синтаксис
        run: |
          composer validate --strict
          find src tests tools -name '*.php' -print0 | xargs -0 -n1 php -l
          echo "KASSA_TEST_ARTIFACTS=$RUNNER_TEMP/sdk-artifacts" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sdk-artifacts"
      - name: Установить основные зависимости
        if: matrix.dependencies != 'lowest'
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          if [ "$DEPENDENCIES" = '8.1' ]; then
            composer update --with 'symfony/http-client:8.1.*' --prefer-dist --no-progress --no-plugins --no-scripts
          else
            composer update --prefer-dist --no-progress --no-plugins --no-scripts
          fi
          composer show symfony/http-client
          composer check-platform-reqs
          composer audit
          cp composer.lock "$KASSA_TEST_ARTIFACTS/sdk.lock"
      - name: Запустить тесты библиотеки
        if: matrix.dependencies != 'lowest'
        run: composer test -- --log-junit "$KASSA_TEST_ARTIFACTS/junit.xml"
      - name: Проверить чистую установку SDK
        if: matrix.dependencies != 'lowest'
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          if [ "$DEPENDENCIES" = 'latest' ]; then
            php tools/check-consumer.php --latest
          else
            composer test:consumer
          fi
      - name: Проверить нижние production-границы и тесты
        if: matrix.dependencies == 'lowest'
        run: composer test:lowest
      - name: Сохранить версии зависимостей и результаты
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-${{ matrix.dependencies }}
          path: ${{ runner.temp }}/sdk-artifacts
          if-no-files-found: ignore
